# =============================================================================
# Production Docker Compose for ZKM
#
# Usage:
#   1. Copy .env.example to .env and fill in secrets
#   2. docker compose up -d
#   3. docker compose exec app npx prisma migrate deploy
#
# TLS termination is handled by a reverse proxy (nginx, Traefik, cloud LB).
# This compose does NOT expose port 3000 directly — use the proxy.
# =============================================================================

services:
  # ── Application Server ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://zkm:${POSTGRES_PASSWORD}@db:5432/zkm?schema=public
      PORT: "3000"
    # Do NOT expose port 3000 publicly — use reverse proxy
    # ports:
    #   - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zkm
      POSTGRES_USER: zkm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Backup script mount
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkm -d zkm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/zkm/pgdata

networks:
  internal:
    driver: bridge
    internal: false  # Allow reverse proxy access

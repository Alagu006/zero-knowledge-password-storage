# =============================================================================
# CI Pipeline for ZKM
#
# Triggers: push to main, pull requests
# Steps: lint, typecheck, test, dependency audit, build, Docker image
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  # ── Lint & Typecheck ──────────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Generate Prisma client
        run: npx prisma generate

  # ── Unit & Integration Tests ──────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npx vitest run
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test?schema=public"
          JWT_SECRET: "test-jwt-secret-for-ci-only-64-bytes-placeholder-value-12345678901234567890"
          TEMP_TOKEN_SECRET: "test-temp-token-secret-for-ci-only-64-bytes-placeholder-value-1234567890"

  # ── Dependency Security Audit ─────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: npm audit (high + critical)
        # Fails the build if any high or critical vulnerabilities are found.
        # Use --audit-level=high to only fail on high/critical (not moderate/low).
        # --production excludes devDependencies from the audit.
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit (full, advisory only)
        # Run full audit for visibility but don't fail on devDep issues.
        # Dev dependencies don't ship in the production Docker image.
        run: npm audit --audit-level=critical || echo "::warning::Critical vulnerabilities found in devDependencies (review recommended)"

  # ── Build & Verify ───────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build TypeScript
        run: npx tsc -p tsconfig.server.json

      - name: Build client (Vite)
        run: npx vite build

  # ── Docker Image Build ───────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: zkm-server:ci-${{ github.sha }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root user in image
        run: |
          # Ensure the production image runs as non-root
          docker run --rm zkm-server:ci-${{ github.sha }} whoami | grep -q "zkm" || \
            (echo "ERROR: Container is not running as non-root user 'zkm'" && exit 1)

      - name: Verify no secrets in image layers
        run: |
          # Check that no .env files or secrets leaked into the image
          docker run --rm zkm-server:ci-${{ github.sha }} find /app -name ".env*" -o -name "*.pem" -o -name "*.key" 2>/dev/null | grep -v "^$" && \
            echo "ERROR: Secrets files found in image" && exit 1 || \
            echo "OK: No secret files found in image"
